<!DOCTYPE html>
<html><head><meta charset=utf-8><title>Catch the Dot</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui;background:#0d0d0d;color:#f5f5f5}
#a{position:relative;width:320px;height:320px;background:#161616;border:1px solid #333;border-radius:12px;overflow:hidden;cursor:crosshair}
#d{position:absolute;width:40px;height:40px;border-radius:50%;background:#4d6bfe}
button{margin-top:16px;padding:10px 20px;border:0;border-radius:8px;background:#4d6bfe;color:#fff;cursor:pointer}
</style></head>
<body><h2>Catch the Dot</h2><div id=a><div id=d></div></div><p>Score: <b id=s>0</b> | Time: <b id=t>30</b></p><button onclick=start()>Restart</button>
<script>
var a=document.getElementById(`a`),d=document.getElementById(`d`),s=document.getElementById(`s`),t=document.getElementById(`t`),sc=0,tm=30,iv=null;
function mv(){var p=8,z=40,mx=a.clientWidth-z-p,my=a.clientHeight-z-p;d.style.left=(p+Math.random()*(mx-p))+`px`;d.style.top=(p+Math.random()*(my-p))+`px`;}
function start(){sc=0;tm=30;s.textContent=0;t.textContent=30;d.style.display=`block`;mv();clearInterval(iv);iv=setInterval(function(){tm--;t.textContent=tm;if(tm<=0){clearInterval(iv);d.style.display=`none`;}},1000);}
d.onclick=function(){if(!iv)return;sc++;s.textContent=sc;mv();};
start();
</script></body></html>
